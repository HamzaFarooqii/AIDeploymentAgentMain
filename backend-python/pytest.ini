[pytest]
# Config lives in backend-python/ so rootdir is backend-python/ regardless
# of the directory pytest is invoked from.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Belt-and-suspenders alongside each test file's own
# `sys.path.insert(0, ...)` hack: makes backend-python/ (this file's
# directory) importable so `import app...` works even for the couple of
# test files that don't do the insert themselves. Requires pytest>=7.
pythonpath = .

# tests/ has an __init__.py, so pytest's default "prepend" import mode
# already adds backend-python/ to sys.path[0] for rootdir-relative
# imports; pythonpath above is a redundant safety net for that same effect.
addopts = -ra --strict-markers

# Keep collection scoped to tests/ only (testpaths already does this,
# this just guards against accidental -k/--collect-only runs from the
# repo root picking up scratch/output directories).
norecursedirs = venv .tmp uploads extracted tmp_manual_framework_check tmp_manual_framework_check_utf8 tmp_run_check .git
